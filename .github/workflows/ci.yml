name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  # R1/R6 架构红线：双布局严格分离，禁止跨轨引入对方资产
  architecture-redlines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: R1 后台 layout 不得引入 importmap / Turbo
        run: |
          set -euo pipefail
          if grep -nE "importmap|turbo|data-turbo|Turbo" app/views/layouts/admin.html.erb; then
            echo "::error::admin layout 违反 R1：不得引入 importmap/Turbo（Turbo 仅前台 layout）"
            exit 1
          fi
          echo "✅ R1 检查通过：admin layout 无 importmap/Turbo"

      - name: R6 前台 application layout 不得引入 Vite / Inertia 后台 bundle
        run: |
          set -euo pipefail
          if grep -nE "vite|inertia|Vite|Inertia" app/views/layouts/application.html.erb; then
            echo "::error::前台 application layout 违反 R6：不得引入 Vite/Inertia 后台 bundle（admin bundle 仅后台 layout 加载）"
            exit 1
          fi
          echo "✅ R6 检查通过：前台 application layout 无 Vite/Inertia"

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Prepare test database
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare

      # 后台使用 Vite/Inertia，测试渲染 admin layout 需先构建 test 环境 vite 资产
      - name: Build Vite test assets
        env:
          RAILS_ENV: test
        run: bin/vite build

      - name: Run minitest
        env:
          RAILS_ENV: test
        run: bin/rails test

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run check

      - name: Frontend unit tests (vitest)
        run: npm run test

      - name: Production Vite build
        env:
          RAILS_ENV: production
        run: bin/vite build
